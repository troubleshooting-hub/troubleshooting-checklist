<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Troubleshooting Checklist Portal</title>

  <link rel="icon" href="./favicon.ico" />
  <link rel="stylesheet" href="./login.css?v=1" />
</head>
<body>
  <main class="login-page">
    <div class="login-shell">
      <section class="login-left">
        <div class="login-left-inner">
          <div class="login-logo-wrap">
            <img src="./assets/aquera-logo.png" alt="Aquera" class="login-logo" />
          </div>

          <div class="login-copy">
            <h1>Troubleshooting Checklist Portal</h1>
            <p>Search issues. Follow checklists. Resolve faster.</p>
          </div>
        </div>
      </section>

      <section class="login-right">
        <div class="login-card">
          <h2>Sign in</h2>
          <p class="login-sub">Use your Google account to continue</p>

          <div id="loginError" class="login-error hidden"></div>

          <button id="googleLoginBtn" class="google-btn" type="button">
            <span class="google-icon">G</span>
            <span>Continue with Google</span>
          </button>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7hu52JLlf9_IA0UA10RaIRiWaoWhIpr8",
      authDomain: "troubleshooting-hub.firebaseapp.com",
      projectId: "troubleshooting-hub",
      storageBucket: "troubleshooting-hub.firebasestorage.app",
      messagingSenderId: "725774852364",
      appId: "1:725774852364:web:5c16dcaffa96a5b7ab6929"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.auth = auth;
    window.firebaseAuthFns = {
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    };

    const s = document.createElement("script");
    s.src = "./login.js?v=1";
    s.defer = true;
    document.body.appendChild(s);
  </script>
</body>
</html>
